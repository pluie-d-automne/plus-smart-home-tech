#spring.profiles.active: test
server:
  port: 0
spring:
  jpa:
    hibernate.ddl-auto: none
    show-sql: true
    properties.hibernate.format_sql: true
  sql:
    init.mode: always
  # Connection to Postgres DB
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:7432/shopping-cart
    username: dbuser
    password: 12345
logging:
  level:
    org:
      springframework:
        orm.jpa: INFO
        transaction: INFO
      zalando:
        logbook: TRACE