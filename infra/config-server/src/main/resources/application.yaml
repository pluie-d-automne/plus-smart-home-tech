spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          searchLocations:
            - classpath:config/telemetry/{application}
server:
  port: 8888
eureka:
  client:
    registerWithEureka: true
    serviceUrl:
      #defaultZone: http://localhost:8761/eureka/
      defaultZone: http://discovery-server:8761/eureka/